name: Modular plant addon

on:
  pull_request:
    paths:
      - '.github/skills/code-apps/templates/modular-plant/**'
      - '.github/skills/code-apps/scripts/check_design_metadata.py'
      - '.github/workflows/modular-plant.yml'
  workflow_dispatch:

permissions:
  contents: read

jobs:
  validate:
    strategy:
      matrix:
        os: [ubuntu-latest, windows-latest]
    runs-on: ${{ matrix.os }}
    defaults:
      run:
        working-directory: .github/skills/code-apps/templates/modular-plant
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: '22.18.0'
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - run: npm ci --ignore-scripts
      - run: python -m pip install -r agent-skill/requirements.txt
      - run: npm run generate
      - run: npm run typecheck
      - run: npm test
      - run: npm run test:skill
      - run: npm run test:metadata
      - run: git diff --exit-code -- src/data/plant-design-validator.js agent-skill/schema.json agent-skill/sample.json public/plant-design